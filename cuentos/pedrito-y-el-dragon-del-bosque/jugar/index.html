to-y-el-dragon-del-bosque\",\"d\"],{\"children\":[\"jugar\",{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"pedrito-y-el-dragon-del-bosque\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"cuentos\",{\"children\":[[\"slug\",\"pedrito-y-el-dragon-del-bosque\",\"d\"],{\"children\":[\"jugar\",{\"children\":[\"__PAGE__\",{},[[\"$L4\",[\"$\",\"div\",null,{\"className\":\"stories_shell__WlYiV\",\"children\":[[\"$\",\"a\",null,{\"className\":\"stories_skipLink__38Zac\",\"href\":\"#cuento\",\"children\":\"Ir al cuento\"}],[\"$\",\"header\",null,{\"className\":\"stories_header__6yNEd\",\"children\":[[\"$\",\"$L5\",null,{\"className\":\"brand\",\"href\":\"/\",\"aria-label\":\"Pintando Juntos, inicio\",\"children\":[[\"$\",\"span\",null,{\"className\":\"brand-mark\",\"aria-hidden\":\"true\",\"children\":\"✎\"}],[\"$\",\"span\",null,{\"className\":\"brand-text\",\"children\":[\"Pintando Juntos\",[\"$\",\"small\",null,{\"children\":\"Ideas para crear\"}]]}]]}],[\"$\",\"$L5\",null,{\"className\":\"stories_homeLink__Wxa8b\",\"href\":\"/\",\"children\":[\"Volver al inicio \",[\"$\",\"span\",null,{\"aria-hidden\":\"true\",\"children\":\"↗\"}]]}]]}],[\"$\",\"main\",null,{\"id\":\"cuento\",\"className\":\"stories_main__bLVr8\",\"tabIndex\":-1,\"children\":[\"$\",\"$L6\",\"pedrito-y-el-dragon-del-bosque:1\",{\"story\":{\"schema_version\":1,\"id\":\"pedrito-y-el-dragon-del-bosque\",\"version\":1,\"metadata\":{\"title\":\"Dante y el dragón del bosque\",\"description\":\"Acompañá a Dante, Bruno, Simon y el abuelo Julio en un campamento con caminos por elegir, un dragón y una botella misteriosa.\",\"category\":\"aventuras\",\"age_min\":4,\"age_max\":8,\"estimated_minutes\":5,\"cover_image\":\"/stories/pedrito/portada-v1.png\"},\"start_scene\":\"rio\",\"state_definition\":{\"flags\":{},\"variables\":{},\"items\":[]},\"scenes\":{\"rio\":{\"type\":\"scene\",\"title\":\"Un día para acampar\",\"image\":\"/stories/pedrito/portada-v1.png\",\"text\":\"Una mañana soleada, Dante salió de campamento con sus primos Bruno y Simon y su abuelo Julio. Llevaban mochilas, una carpa y todo lo necesario para acampar en el bosque.\\n\\nEl día estaba precioso. El sol se asomaba entre las hojas y los pájaros acompañaban sus pasos. Después de caminar un rato, los cuatro llegaron a la orilla de un río.\\n\\n—Tenemos que decidir por dónde seguir —dijo el abuelo Julio.\",\"choices\":[{\"id\":\"seguir_rio\",\"text\":\"Seguir el curso del río\",\"target\":\"cueva\"},{\"id\":\"construir_puente\",\"text\":\"Construir un puente con el abuelo\",\"target\":\"puente_pendiente\"}]},\"cueva\":{\"type\":\"scene\",\"title\":\"Un refugio inesperado\",\"image\":\"/stories/pedrito/cueva-dragon-v1.png\",\"text\":\"Los cuatro siguieron el curso del río hasta encontrar una cueva. No podían ver qué había en el fondo, pero el cielo empezó a cubrirse de nubes oscuras. Sonó un trueno: ¡se acercaba una tormenta!\\n\\nDante, Bruno y Simon entraron a refugiarse junto al abuelo Julio. Entonces escucharon un resoplido. Algo enorme se movió entre las sombras.\\n\\n¡Era un dragón!\\n\\nLos primos se quedaron quietos. Tenía un aspecto aterrador, pero no sabían si era bueno o malo.\",\"choices\":[{\"id\":\"escapar_cueva\",\"text\":\"Salir corriendo junto al abuelo\",\"target\":\"paseo_bosque\"},{\"id\":\"cantar_dragon\",\"text\":\"Cantar una canción para calmarlo\",\"target\":\"cancion\"}]},\"cancion\":{\"type\":\"scene\",\"title\":\"Una canción para el dragón\",\"image\":\"/stories/pedrito/cancion-dragon-v1.png\",\"text\":\"Los tres primos comenzaron a cantar. Para su sorpresa, el dragón movió la cabeza al compás de la canción. ¡Parecía encantado!\\n\\nCuando terminaron, bajó la cabeza y se quedó quieto, invitándolos a subir. Dante miró al abuelo Julio, que sonrió, y los cuatro se acomodaron sobre el lomo del dragón.\\n\\nEl dragón desplegó sus enormes alas y levantó vuelo.\",\"choices\":[{\"id\":\"seguir_vuelo\",\"text\":\"Seguir leyendo\",\"target\":\"vuelo\"}]},\"vuelo\":{\"type\":\"scene\",\"title\":\"Nuestra casa desde el cielo\",\"image\":\"/stories/pedrito/vuelo-dragon-v1.png\",\"text\":\"Volaron alto, dejaron atrás las nubes de tormenta y salieron otra vez a la luz del sol.\\n\\n—¡Miren! —exclamó Dante—. ¡Desde acá se ve nuestra casa!\\n\\nComo todavía era temprano para volver y el tiempo ya había mejorado, Dante tuvo una idea:\\n\\n—¿Y si antes de regresar vamos a tomar un helado?\\n\\nBruno y Simon festejaron la propuesta. El abuelo Julio señaló una heladería y el dragón bajó suavemente hasta un claro cercano.\",\"choices\":[{\"id\":\"seguir_heladeria\",\"text\":\"Seguir leyendo\",\"target\":\"heladeria\"}]},\"heladeria\":{\"type\":\"final\",\"final_type\":\"ending\",\"title\":\"Un helado entre amigos\",\"image\":\"/stories/pedrito/heladeria-v1.png\",\"text\":\"Poco después, los cuatro disfrutaban sus helados junto a su nuevo amigo. ¡El dragón también había recibido uno!\\n\\n—Salimos a buscar un lugar para acampar y terminamos tomando helado con un dragón —dijo el abuelo Julio, riéndose.\\n\\nDespués de despedirse de su amigo alado, regresaron a casa con una aventura increíble para contar.\"},\"paseo_bosque\":{\"type\":\"scene\",\"title\":\"Un dragón que no era malo\",\"image\":\"/stories/pedrito/huida-dragon-v1.png\",\"text\":\"Los primos y el abuelo Julio salieron corriendo de la cueva. El dragón fue detrás de ellos y, antes de que pudieran alejarse, los recogió con su enorme boca, con mucho cuidado, y levantó vuelo.\\n\\nAl principio estaban asustados, pero pronto descubrieron que no quería hacerles daño. ¡Los estaba llevando de paseo!\\n\\nVolaron sobre los rincones más bonitos del bosque, entre árboles gigantes y lagunas brillantes. Finalmente, el dragón aterrizó en un claro junto a una cascada y los dejó suavemente sobre el pasto.\",\"choices\":[{\"id\":\"seguir_campamento\",\"text\":\"Seguir leyendo\",\"target\":\"campamento\"}]},\"campamento\":{\"type\":\"scene\",\"title\":\"La noche junto a la cascada\",\"image\":\"/stories/pedrito/campamento-cascada-v1.png\",\"text\":\"Entre todos juntaron ramas y el abuelo preparó un lugar para la fogata. El dragón sopló una pequeña llamarada y encendió el fuego.\\n\\nAllí pudieron cocinar y, cuando llegó la noche, se acomodaron en la carpa, calentitos y acompañados por su nuevo amigo.\",\"choices\":[{\"id\":\"seguir_manana\",\"text\":\"A la mañana siguiente\",\"target\":\"balsa\"}]},\"balsa\":{\"type\":\"scene\",\"title\":\"El viaje de regreso\",\"image\":\"/stories/pedrito/balsa-construccion-v1.png\",\"text\":\"A la mañana siguiente, el sonido de la cascada despertó a Dante. Afuera, Bruno, Simon y el abuelo Julio ya estaban pensando cómo volver.\\n\\n—¡Podemos hacer una balsa y regresar río abajo! —propuso Dante.\\n\\nCerca del campamento encontraron los troncos de un árbol caído. Con la ayuda del abuelo, los unieron usando las cuerdas que habían llevado.\\n\\nCuando la balsa estuvo lista, guardaron sus cosas y se despidieron del dragón. Los cuatro subieron a bordo y comenzaron a navegar río abajo, rumbo al lugar donde había empezado su aventura.\",\"choices\":[{\"id\":\"seguir_navegacion\",\"text\":\"Seguir leyendo\",\"target\":\"botella\"}]},\"botella\":{\"type\":\"scene\",\"title\":\"Un mensaje en el río\",\"image\":\"/stories/pedrito/botella-rio-v1.png\",\"text\":\"Mientras navegaban río abajo, Simon vio algo que brillaba entre las ondas.\\n\\n—¡Una botella!\\n\\nBruno logró alcanzarla y se la pasó a Dante. Dentro había un papel enrollado. Lo sacaron con cuidado y el abuelo Julio leyó el mensaje:\\n\\n«Hola, soy el náufrago. Estoy perdido en la Isla de los Recuerdos. Necesito ayuda para volver».\\n\\nLos cuatro se miraron. Su viaje estaba por terminar, pero alguien necesitaba ayuda.\",\"choices\":[{\"id\":\"terminar_regreso\",\"text\":\"Continuar el regreso a casa\",\"target\":\"regreso_pendiente\"},{\"id\":\"ayudar_naufrago\",\"text\":\"Ayudar al náufrago\",\"target\":\"isla_recuerdos\"}]},\"isla_recuerdos\":{\"type\":\"final\",\"final_type\":\"continuation\",\"title\":\"Rumbo a la Isla de los Recuerdos\",\"image\":\"/stories/pedrito/mapa-isla-v1.png\",\"text\":\"Decidieron ayudar al náufrago. El abuelo Julio abrió el mapa junto a los chicos para encontrar la Isla de los Recuerdos.\\n\\nUna vez que supieron dónde estaba, marcharon hacia allí, dispuestos a ayudarlo.\\n\\nLa aventura continuará…\"},\"puente_pendiente\":{\"type\":\"final\",\"final_type\":\"pending\",\"title\":\"El camino del puente\",\"text\":\"La aventura de construir el puente todavía está por contar.\\n\\nPodés volver al río y explorar otro camino.\"},\"regreso_pendiente\":{\"type\":\"final\",\"final_type\":\"pending\",\"title\":\"Seguir el regreso\",\"text\":\"Dante, Bruno, Simon y el abuelo Julio deciden continuar el regreso a casa.\\n\\nEsta parte de la aventura todavía está por contar. Podés volver al mensaje de la botella y explorar el otro camino.\"}}}}]}],[\"$\",\"footer\",null,{\"className\":\"stories_footer__ABKEM\",\"children\":\"Un cuento para leer, elegir y compartir.\"}]]}],[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/contame_un_cuento/_next/static/css/e5085b074aa368b3.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]]],null],null]},[null,[\"$\",\"$L7\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cuentos\",\"children\",\"$8\",\"children\",\"jugar\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L9\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L7\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cuentos\",\"children\",\"$8\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L9\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\
